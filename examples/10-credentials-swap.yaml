# 10 — Credentials strategy swap
#
# Use case: "I can switch a profile from file-backed credential persistence
# to an AuthZ-API-backed one by changing one block — every transform,
# processor, and guardrail stays identical."
#
# The v1 spec deliberately stops at *persistence*: how the credential blob
# is stored and retrieved. The actual OAuth dance, refresh schedule, and
# token shape are host concerns.
#
# This file shows two strategies side-by-side: `kind: file` for self-hosted
# local-dev setups, `kind: authz-api` for the hosted production deployment.
# The transforms and guardrails are intentionally identical across both
# documents — only `credentials:` differs.

# ─── Self-hosted: file-backed credentials ────────────────────────────────────
# Use for local development. Each connection gets its own file, named for the
# connection (the `{name}` token interpolates against the matched name).
apiVersion: civic.com/agent-profile/v1alpha1
matches:
  - name: gmail
  - name: github

credentials:
  kind: file
  path: "~/.foo/creds/{name}.json"
  mode: 0600

transforms:
  - kind: alias
    target: sendEmail
    to: emailTeam
    description: Send an email to the engineering team distribution list.

guardrails:
  - stage: request
    target: emailTeam
    when:
      schemaPath: "$.to[*]"
      operator: not_ends_with
      value: "@foo.com"
    outcome: block
    reason: "Outbound email is restricted to @foo.com recipients."

---
# ─── Production: AuthZ-API-backed credentials ────────────────────────────────
# Same connections, same overlay — but persistence is delegated to an
# external AuthZ service. The host runs jobs against the API, awaits
# completion, and retrieves the resolved token via REST.
#
# To deploy this file in prod instead of the file-backed block above, swap
# the two `credentials:` blocks. The transforms and guardrails do not move.
apiVersion: civic.com/agent-profile/v1alpha1
matches:
  - name: gmail-prod
  - name: github-prod

credentials:
  kind: authz-api
  baseUrl: "https://app.foo.com/authz/api"
  # `serverId:` is optional. Omitting it tells the host to use the connection
  # name as the AuthZ catalogue identifier. Override when the AuthZ catalogue
  # uses a different naming scheme.

transforms:
  - kind: alias
    target: sendEmail
    to: emailTeam
    description: Send an email to the engineering team distribution list.

guardrails:
  - stage: request
    target: emailTeam
    when:
      schemaPath: "$.to[*]"
      operator: not_ends_with
      value: "@foo.com"
    outcome: block
    reason: "Outbound email is restricted to @foo.com recipients."
